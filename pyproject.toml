[project]
name = "trading-agent"
version = "0.1.0"
description = "Retail-style AI trading desk: AI reads the charts and writes plans, code checks risk, Taz approves every entry."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26", "pandas>=2.2", "TA-Lib==0.8.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
